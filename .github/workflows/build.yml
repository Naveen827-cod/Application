
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          mkdir -p source
          unzip -o NaveenRx100.zip -d source
          echo "=== Source structure ==="
          ls -la source
          echo "=== Looking for project root ==="
          find source -name "settings.gradle" -type f
          find source -name "gradlew" -type f

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          PROJECT_ROOT=$(dirname "$(find source -name 'settings.gradle' -type f | head -1)")
          echo "Project root: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
