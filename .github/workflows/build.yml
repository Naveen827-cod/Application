
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_API_LEVEL: 35
      BUILD_TOOLS_VERSION: 35.0.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -name "*.zip" -type f | head -1)
          echo "Found zip: $ZIP"
          mkdir -p /tmp/src
          unzip -o "$ZIP" -d /tmp/src
          find /tmp/src -name "settings.gradle" -type f
          find /tmp/src -name "colors.xml" -type f

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK env
        run: |
          set -e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$(dirname $SDKMANAGER)" >> $GITHUB_PATH

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${BUILD_TOOLS_VERSION}" || true

      - name: Patch missing color resources
        run: |
          set -e
          PROJECT_DIR=$(dirname "$(find /tmp/src -name 'settings.gradle' -type f | head -1)")
          APP_DIR="$PROJECT_DIR/app"
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR=$(dirname "$(find /tmp/src -name 'AndroidManifest.xml' -path '*/app/*' -type f | head -1)")
          fi
          VALUES_DIR="$APP_DIR/src/main/res/values"
          mkdir -p "$VALUES_DIR"
          COLORS_FILE="$VALUES_DIR/colors.xml"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <color name="text_dark">#000000</color>' '    <color name="text_light">#FFFFFF</color>' '</resources>' > "$COLORS_FILE"
          echo "Final colors.xml:"
          cat "$COLORS_FILE"

      - name: Build Debug APK
        run: |
          set -e
          PROJECT_DIR=$(dirname "$(find /tmp/src -name 'settings.gradle' -type f | head -1)")
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Errors: ==="
          grep -i "error:" /tmp/build.log | head -30 || true
          exit $EXIT_CODE

      - name: Find APK
        if: always()
        run: find /tmp/src -name "*.apk" -type f

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
