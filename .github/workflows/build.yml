
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_API_LEVEL: 35
      BUILD_TOOLS_VERSION: 35.0.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -name "*.zip" -type f | head -1)
          echo "Found zip: $ZIP"
          mkdir -p /tmp/src
          unzip -o "$ZIP" -d /tmp/src
          echo "=== Finding settings.gradle ==="
          find /tmp/src -name "settings.gradle" -type f
          echo "=== Finding colors.xml files ==="
          find /tmp/src -name "colors.xml" -type f

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK env
        run: |
          set -e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$(dirname $SDKMANAGER)" >> $GITHUB_PATH

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${BUILD_TOOLS_VERSION}" || true

      - name: Patch missing color resources
        run: |
          set -e
          PROJECT_DIR=$(dirname "$(find /tmp/src -name 'settings.gradle' -type f | head -1)")
          echo "Project dir: $PROJECT_DIR"
          
          # Find app module
          APP_DIR="$PROJECT_DIR/app"
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR=$(dirname "$(find /tmp/src -name 'AndroidManifest.xml' -path '*/app/*' -type f | head -1)")
          fi
          echo "App dir: $APP_DIR"
          
          VALUES_DIR="$APP_DIR/src/main/res/values"
          mkdir -p "$VALUES_DIR"
          
          COLORS_FILE="$VALUES_DIR/colors.xml"
          
          if [ -f "$COLORS_FILE" ]; then
            echo "=== Existing colors.xml ==="
            cat "$COLORS_FILE"
            # Check if text_dark is defined
            if ! grep -q 'name="text_dark"' "$COLORS_FILE"; then
              echo "Adding text_dark to existing colors.xml..."
              # Insert before </resources>
              sed -i 's|</resources>|    <color name="text_dark">#000000</color>\n</resources>|' "$COLORS_FILE"
            fi
          else
            echo "Creating new colors.xml..."
            cat > "$COLORS_FILE" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="text_dark">#000000</color>
    <color name="text_light">#FFFFFF</color>
</resources>
EOF
          fi
          
          echo "=== Final colors.xml ==="
          cat "$COLORS_FILE"

      - name: Build Debug APK
        run: |
          set -e
          PROJECT_DIR=$(dirname "$(find /tmp/src -name 'settings.gradle' -type f | head -1)")
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        if: always()
        run: find /tmp/src -name "*.apk" -type f

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn          fi
          
          echo "=== Final colors.xml ==="
          cat "$COLORS_FILE"

      - name: Build Debug APK
        run: |
          set -e
          PROJECT_DIR=$(dirname "$(find /tmp/src -name 'settings.gradle' -type f | head -1)")
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        if: always()
        run: find /tmp/src -name "*.apk" -type f

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
