
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_API_LEVEL: 35
      BUILD_TOOLS_VERSION: 35.0.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          set -e
          echo "=== Listing repo root ==="
          ls -la
          echo "=== Finding zip ==="
          ZIP=$(find . -maxdepth 2 -name "*.zip" -type f | head -1)
          echo "Found zip: $ZIP"
          mkdir -p /tmp/src
          unzip -o "$ZIP" -d /tmp/src
          echo "=== Extracted structure ==="
          ls -la /tmp/src
          echo "=== Finding settings.gradle ==="
          find /tmp/src -name "settings.gradle" -type f
          echo "=== Finding gradlew ==="
          find /tmp/src -name "gradlew" -type f

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK env
        run: |
          set -e
          echo "=== SDK root: $ANDROID_SDK_ROOT ==="
          ls -la "$ANDROID_SDK_ROOT" || true
          echo "=== cmdline-tools ==="
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools" || true
          
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager path: $SDKMANAGER"
          
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          
          "$SDKMANAGER" --version
          echo "$(dirname $SDKMANAGER)" >> $GITHUB_PATH

      - name: Accept licenses
        run: |
          set -e
          yes | sdkmanager --licenses || true
          echo "=== Licenses accepted ==="

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${BUILD_TOOLS_VERSION}" || true
          echo "=== Installed packages ==="
          sdkmanager --list_installed || true

      - name: Build Debug APK
        run: |
          set -e
          PROJECT_DIR=$(dirname "$(find /tmp/src -name 'settings.gradle' -type f | head -1)")
          echo "=== Project dir: $PROJECT_DIR ==="
          cd "$PROJECT_DIR"
          
          echo "=== Project files ==="
          ls -la
          
          echo "=== Creating local.properties ==="
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          
          echo "=== Setting gradlew permission ==="
          chmod +x gradlew
          ls -la gradlew
          
          echo "=== Checking gradle wrapper ==="
          ls -la gradle/wrapper/ || echo "No wrapper dir"
          
          echo "=== Starting build ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --info

      - name: Find APK
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find /tmp/src -name "*.apk" -type f || true
          find /tmp/src -path "*/build/outputs/*" -type d || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
